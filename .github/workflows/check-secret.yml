name: Check Secret

on:
  workflow_dispatch:  # Trigger manually from the GitHub Actions UI

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check if secret is set
        run: |
          if [ -z "${{ secrets.CI_ACCESS_TOKEN_SECRET }}" ]; then
            echo "❌ Secret CI_ACCESS_TOKEN_SECRET is NOT set or not accessible"
            exit 1
          else
            echo "✅ Secret CI_ACCESS_TOKEN_SECRET is set"
          fi